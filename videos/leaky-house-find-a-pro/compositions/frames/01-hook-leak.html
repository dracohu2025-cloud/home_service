  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="01-hook-leak"]');
      var q = function (sel) { return root.querySelector(sel); };
      var qa = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };
      var byId = function (id) { return root.querySelector('[id="' + id + '"]'); };

      var W = 1440, H = 1080;
      var cw = W / 100, ch = H / 100;
      var landings = [[43.06 * cw, 34.7 * ch], [48.6 * cw, 28 * ch], [59.7 * cw, 38 * ch]];
      var hits = [1.3, 2.0, 2.7];
      var angles = [-9, 6, -3];

      var splashHost = byId("01-hook-leak-splashes");
      var splashes = [];
      for (var i = 0; i < 3; i++) {
        var set = [];
        for (var k = 0; k < 4; k++) {
          var s = document.createElement("div");
          s.className = "h01-abs h01-spl";
          s.style.left = (landings[i][0] - 0.55 * cw) + "px";
          s.style.top = (landings[i][1] - 0.55 * cw) + "px";
          splashHost.appendChild(s);
          set.push(s);
        }
        splashes.push(set);
      }

      var tl = gsap.timeline({ paused: true });

      var housy = byId("01-hook-leak-housy");
      var squash = byId("01-hook-leak-squash");
      var jitter = byId("01-hook-leak-jitter");
      var sleep = byId("01-hook-leak-sleep");
      var worried = byId("01-hook-leak-worried");

      // Scene 1 — night ground, moon, stars, Housy asleep, Zzz
      tl.set(sleep, { opacity: 1 }, 0);
      tl.set(worried, { opacity: 0 }, 0);
      tl.fromTo(byId("01-hook-leak-moon"), { scale: 0.7, rotation: -12, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.6, ease: "back.out(1.4)" }, 0);
      tl.fromTo(qa(".h01-star"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.4)", stagger: 0.12 }, 0.1);
      tl.fromTo(qa(".h01-orn"), { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.05);
      tl.fromTo(byId("01-hook-leak-patch"), { scaleX: 0.6, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo(housy, { scale: 0.88, opacity: 0, transformOrigin: "50% 100%" }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.4)" }, 0);

      qa(".h01-z").forEach(function (z, idx) {
        tl.fromTo(z, { x: 0, y: 20, opacity: 0, rotation: -10 },
          { x: 18 + idx * 14, y: -60 - idx * 22, opacity: 1, rotation: 8, duration: 0.9, ease: "power2.out" }, 0.2 + idx * 0.3);
      });

      // Subtitle band
      tl.fromTo(byId("01-hook-leak-sub"), { y: 1.2 * ch, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.25);

      // Scene 2 — three drops, splats, 滴! stickers
      tl.to(byId("01-hook-leak-zwrap"), { opacity: 0, duration: 0.25, ease: "power2.out" }, hits[0]);

      for (var d = 0; d < 3; d++) {
        var drop = byId("01-hook-leak-drop" + d);
        var T = hits[d];
        var fallFrom = -(landings[d][1] + 60);
        tl.fromTo(drop, { y: fallFrom, scaleX: 0.85, scaleY: 1.15, opacity: 1, transformOrigin: "50% 100%" },
          { y: 0, duration: 0.38, ease: "power2.in", immediateRender: true }, T - 0.38);
        tl.to(drop, { scaleX: 1.8, scaleY: 0.3, duration: 0.08, ease: "power2.out" }, T);
        tl.to(drop, { opacity: 0, duration: 0.12, ease: "power1.out" }, T + 0.08);

        splashes[d].forEach(function (s, k) {
          var ang = (-160 + k * 46.67) * Math.PI / 180;
          var dist = 34 + (k % 2) * 12;
          tl.fromTo(s, { x: 0, y: 0, scale: 1, opacity: 0 },
            { x: Math.cos(ang) * dist, y: Math.sin(ang) * dist, scale: 0.4, opacity: 1, duration: 0.3, ease: "power2.out" }, T);
          tl.to(s, { opacity: 0, duration: 0.12, ease: "power1.in" }, T + 0.2);
        });

        tl.fromTo(squash, { scaleY: 1, transformOrigin: "50% 100%" }, { scaleY: 0.97, duration: 0.07, ease: "power2.out", immediateRender: false }, T);
        tl.to(squash, { scaleY: 1, duration: 0.18, ease: "power2.out" }, T + 0.07);

        tl.fromTo(byId("01-hook-leak-di" + d), { scale: 0, rotation: 0, opacity: 0 },
          { scale: 1, rotation: angles[d], opacity: 1, duration: 0.4, ease: "back.out(1.4)" }, T + 0.03);
      }

      // Scene 3 — wake-up swap, LEAK badge, trembling hold
      tl.set(sleep, { opacity: 0 }, 3.1);
      tl.set(worried, { opacity: 1 }, 3.1);
      tl.fromTo(squash, { scaleY: 0.94, scaleX: 1.04, transformOrigin: "50% 100%" }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(1.4)", immediateRender: false }, 3.1);
      tl.fromTo(jitter, { y: 0 }, { y: -14, duration: 0.12, ease: "power2.out" }, 3.1);
      tl.to(jitter, { y: 0, duration: 0.16, ease: "power2.in" }, 3.22);

      tl.fromTo(byId("01-hook-leak-alert"), { scale: 0.4, y: 30, opacity: 0, rotation: -4 },
        { scale: 1, y: 0, opacity: 1, rotation: -2, duration: 0.45, ease: "back.out(1.4)" }, 3.3);

      var steps = 28, t0 = 3.45, dt = 0.055;
      for (var j = 0; j < steps; j++) {
        var amp = 2.6 + (j % 3) * 0.6;
        var xv = (j === steps - 1) ? 0 : (j % 2 === 0 ? amp : -amp);
        tl.to(jitter, { x: xv, duration: dt, ease: "sine.inOut" }, t0 + j * dt);
      }

      tl.to({}, { duration: 0.001 }, 4.999);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-hook-leak"] = tl;
    })();
