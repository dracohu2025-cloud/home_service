      var rl1 = q(".fr05-rl-1");
      var rl2 = q(".fr05-rl-2");
      var card = q(".fr05-card");
      var ring = q(".fr05-ring");
      var frac = q(".fr05-frac");
      var f0 = q(".fr05-f0"), f1 = q(".fr05-f1"), f2 = q(".fr05-f2");
      var approx = q(".fr05-approx");
      var caption = q(".fr05-caption");
      var chips = qa(".fr05-chip");
      var meta = q(".fr05-meta");
      var sub = q(".fr05-sub");

      gsap.set(neutral, { opacity: 0 });
      gsap.set([rl1, rl2], { opacity: 0, transformOrigin: "50% 50%" });
      gsap.set(handset, { transformOrigin: "50% 50%" });
      gsap.set([f0, f1, f2, approx], { opacity: 0 });

      // ---- Scene 1 (0.0–1.7s): badge, ornaments, Housy + ringing phone ----
      tl.fromTo(q(".fr05-bg"), { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.fromTo(q(".fr05-badge"), { y: -2 * CQH, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0);
      tl.fromTo(qa(".fr05-orn"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.4)", stagger: 0.06 }, 0.05);
      tl.fromTo(housy, { y: 3 * CQH, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.4)" }, 0.05);
      tl.fromTo(phone, { y: 3 * CQH, opacity: 0, rotation: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.4)" }, 0.12);

      // ringing: phone shakes 0.4–1.6 (finite)
      var shakeAngles = [6, -6, 6, -6, 5, -5, 6, -6, 5, -5, 4, 0];
      shakeAngles.forEach(function (a, i) {
        tl.to(phone, { rotation: a, duration: 0.1, ease: "sine.inOut" }, 0.4 + i * 0.1);
      });
      // ringing lines pulse 4× then fade out by 1.6
      [0.4, 0.7, 1.0, 1.3].forEach(function (t) {
        tl.fromTo(rl1, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out" }, t);
        tl.to(rl1, { opacity: 0, scale: 1.1, duration: 0.16, ease: "power1.in" }, t + 0.12);
        tl.fromTo(rl2, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out" }, t + 0.05);
        tl.to(rl2, { opacity: 0, scale: 1.1, duration: 0.16, ease: "power1.in" }, t + 0.17);
      });
      // Housy's worried jitter while it rings
      [0.5, 0.75, 1.0, 1.25].forEach(function (t, i) {
        tl.to(housy, { x: (i % 2 ? -0.3 : 0.3) * CQW, duration: 0.12, ease: "sine.inOut" }, t);
      });
      tl.to(housy, { x: 0, duration: 0.12, ease: "sine.inOut" }, 1.45);

      // pickup at 1.7: handset lifts to Housy's side; hard swap worried → neutral + squash
      tl.fromTo(handset, { x: 0, y: 0, rotation: 0 }, { x: -140, y: -185, rotation: -62, duration: 0.45, ease: "power3.out" }, 1.7);
      tl.set(worried, { opacity: 0 }, 1.7);
      tl.set(neutral, { opacity: 1 }, 1.7);
      tl.fromTo(housy, { scaleY: 0.94 }, { scaleY: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, 1.7);

      // ---- Scene 2 (1.7–3.6s): card + 2/3 ring count-up ----
      tl.fromTo(card, { y: 4 * CQH, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.75);

      var LEN = (ring.getTotalLength && ring.getTotalLength()) || 2 * Math.PI * 130;
      ring.style.strokeDasharray = LEN;
      var PCT = 0.66;
      gsap.set(ring, { opacity: 0 });
      tl.set(ring, { opacity: 1 }, 2.0);
      tl.fromTo(ring, { strokeDashoffset: LEN }, { strokeDashoffset: LEN * (1 - PCT), duration: 1.4, ease: "power1.inOut" }, 2.0);

      // readout ticks 0/3 → 1/3 → 2/3 in step with the ring, scale grows with value
      tl.set(f0, { opacity: 1 }, 2.0);
      tl.fromTo(frac, { scale: 0.7 }, { scale: 0.82, duration: 0.3, ease: "power3.out" }, 2.0);
      tl.set(f0, { opacity: 0 }, 2.7);
      tl.set(f1, { opacity: 1 }, 2.7);
      tl.to(frac, { scale: 0.9, duration: 0.3, ease: "power3.out" }, 2.7);
      tl.set(f1, { opacity: 0 }, 3.4);
      tl.set([f2, approx], { opacity: 1 }, 3.4);
      tl.to(frac, { scale: 1, duration: 0.3, ease: "power3.out" }, 3.4);

      tl.fromTo(caption, { y: 1.5 * CQH, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 2.9);

      // ---- Scene 3 (3.6–6.0s): chips reveal, then get crossed out ----
      tl.fromTo(chips, { y: 1.8 * CQH, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out", stagger: 0.08 }, 3.6);
      tl.fromTo(meta, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 3.9);

      [4.0, 4.5, 5.0].forEach(function (t, i) {
        var chip = chips[i];
        var p1 = chip.querySelector(".fr05-strike-p");
        var p2 = chip.querySelector(".fr05-strike-p2");
        var l1 = (p1.getTotalLength && p1.getTotalLength()) || 210;
        var l2 = (p2.getTotalLength && p2.getTotalLength()) || 200;
        p1.style.strokeDasharray = l1;
        p2.style.strokeDasharray = l2;
        tl.fromTo(p1, { strokeDashoffset: l1 }, { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, t);
        tl.fromTo(p2, { strokeDashoffset: l2 }, { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, t + 0.16);
        tl.to(chip.querySelector(".fr05-chip-text"), { opacity: 0.5, duration: 0.2, ease: "power1.out" }, t + 0.1);
      });

      // subtle finite nod from Housy on the phone during the hold
      tl.to(housy, { rotation: -1.5, duration: 0.3, ease: "sine.inOut" }, 5.3);
      tl.to(housy, { rotation: 0, duration: 0.3, ease: "sine.inOut" }, 5.6);

      // ---- subtitle band (+0.25s, stays) ----
      tl.fromTo(sub, { y: 1.2 * CQH, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.25);

      tl.set({}, {}, 6);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
